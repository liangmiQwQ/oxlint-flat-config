name: Release

on:
  push:
    branches: [main, 'release/*-pending']
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`'
        required: false
        default: ''
      npm-tag:
        description: 'npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise'
        required: false
        default: ''
      releases:
        description: 'Publish payload emitted by uppt/release; leave empty when rerunning a publish by hand'
        required: false
        default: ''

permissions: {}

jobs:
  # uppt's independent updater rebuilds the branch; hand edits only need metadata refreshed.
  sync-pr:
    if: |
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/release/')
      && github.actor != 'github-actions[bot]'
      && !github.event.deleted
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: sync-release-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run release:sync-pr
        env:
          GH_TOKEN: ${{ github.token }}

  # open or update a draft release PR from conventional commits
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}
          mode: independent
          packages: |
            packages/*
          scopes: |
            oxlint-flat-config: core

  # release PR merged: tag each package, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mode: independent
          packages: |
            packages/*

  # the chained dispatch lands here on the release tag; build the tarball(s)
  pack:
    if: |
      github.event_name == 'workflow_dispatch'
      && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/release-'))
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          releases: ${{ inputs.releases }}
          packages: |
            packages/*

  # publish the prebuilt tarball(s) directly to npm via OIDC
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/release-'))
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Update npm
        run: npm install -g npm@latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uppt-tarball
          path: ${{ runner.temp }}/uppt-tarballs
      - name: Publish to npm
        env:
          TARBALL_DIR: ${{ runner.temp }}/uppt-tarballs
          TARBALL_FILES: ${{ needs.pack.outputs.files }}
          NPM_TAG: ${{ inputs.npm-tag }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { basename, resolve } from 'node:path'

          const files = JSON.parse(process.env.TARBALL_FILES)
          if (!Array.isArray(files) || files.length === 0) {
            throw new Error('Expected a non-empty list of tarballs from uppt/pack')
          }

          // Preserve pack order so workspace dependencies are published first.
          for (const file of files) {
            if (typeof file !== 'string' || basename(file) !== file) {
              throw new Error(`Invalid tarball filename: ${file}`)
            }
            const version = file.match(/-(\d+\.\d+\.\d+(?:-[\w.-]+)?(?:\+[\w.-]+)?)\.tgz$/)?.[1]
            if (!version) throw new Error(`Cannot determine version from ${file}`)

            // Keep prereleases off latest, including numeric prereleases such as 0.1.0-0.
            const prerelease = version.split('+')[0].split('-').slice(1).join('-')
            const identifier = prerelease.replace(/(?:^|\.)\d+$/, '')
            const tag = process.env.NPM_TAG?.trim() || (prerelease ? identifier || 'next' : 'latest')
            execFileSync('npm', [
              'publish', resolve(process.env.TARBALL_DIR, file),
              '--provenance', '--ignore-scripts', '--access=public', `--tag=${tag}`
            ], { stdio: 'inherit' })
          }
          NODE
